{% extends 'base.html' %}
{% block title %}{{ 'Edit' if room else 'Add' }} Room{% endblock %}
{% block content %}
{% set d = form_data if form_data else (room if room else {}) %}
<h3 class="mb-3">{{ 'Edit' if room else 'Add' }} Room</h3>
<form method="post" class="card p-4" novalidate>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Room Number</label><input name="room_number" class="form-control" value="{{ d.get('room_number', '') }}" required></div>
    <div class="col-md-6"><label class="form-label">Room Type</label>
      <select name="room_type" class="form-select">
      {% for t in ['Single', 'Double', 'Triple', 'Dormitory'] %}<option {{ 'selected' if d.get('room_type') == t }}>{{ t }}</option>{% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">Bed Capacity</label><input type="number" min="1" name="capacity" class="form-control" value="{{ d.get('capacity', '') }}" required></div>
    <div class="col-md-6"><label class="form-label">Monthly Fee (₹)</label><input type="number" min="0" step="0.01" name="monthly_fee" class="form-control" value="{{ d.get('monthly_fee', '') }}" required></div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2">{{ d.get('description', '') }}</textarea></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('rooms') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
